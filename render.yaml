services:
  - type: web
    name: backend-spring
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: clinica-db-render
          property: host
      - key: DB_PORT
        fromDatabase:
          name: clinica-db-render
          property: port
      - key: DB_NAME
        fromDatabase:
          name: clinica-db-render
          property: database
      - key: DB_USER
        fromDatabase:
          name: clinica-db-render
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: clinica-db-render
          property: password

  - type: web
    name: clinica-frontend
    runtime: static
    repo: https://github.com/davipuddo/ES2_TP2.git
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Injeta o host público do backend; o api.js normaliza para https://host/api
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: backend-spring
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Configuração do banco de dados PostgreSQL 15
  - name: clinica-db-render
    databaseName: clinica_db
    plan: free
