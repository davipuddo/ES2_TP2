services:
  - type: web
    name: backend-spring
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: clinica-db-render
          property: host
      - key: DB_PORT
        fromDatabase:
          name: clinica-db-render
          property: port
      - key: DB_NAME
        fromDatabase:
          name: clinica-db-render
          property: database
      - key: DB_USER
        fromDatabase:
          name: clinica-db-render
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: clinica-db-render
          property: password

databases:
  # Configuração do banco de dados PostgreSQL 15
  - name: clinica-db-render
    databaseName: clinica_db
    plan: free
